name: Extract Source ZIP And Optional Bash From Last Commit

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Quando true, apenas detecta, valida e exibe o que seria feito sem alterar o repositório"
        required: true
        default: false
        type: boolean
      extract_destination:
        description: "Diretório de destino para extrair o ZIP, relativo à raiz do repositório"
        required: true
        default: "."
        type: string
      execute_bash_from_markdown:
        description: "Quando true, executa blocos bash do .md citado no último commit"
        required: true
        default: true
        type: boolean
      commit_extracted_files:
        description: "Quando true, cria commit e push dos arquivos extraídos/alterados"
        required: true
        default: true
        type: boolean
      commit_message_prefix:
        description: "Prefixo da mensagem do commit automático"
        required: true
        default: "chore(actions): apply extracted source zip"
        type: string

permissions:
  contents: write

jobs:
  extract-source-zip-and-optional-bash:
    name: Detect ZIP, extract source files and optionally run Markdown bash
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do repositório para ler o último commit e acessar arquivos versionados.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Resolve os valores do workflow para suportar execução manual e automática via push.
      - name: Resolve workflow options
        id: resolve_options
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_EXTRACT_DESTINATION: ${{ inputs.extract_destination }}
          INPUT_EXECUTE_BASH_FROM_MARKDOWN: ${{ inputs.execute_bash_from_markdown }}
          INPUT_COMMIT_EXTRACTED_FILES: ${{ inputs.commit_extracted_files }}
          INPUT_COMMIT_MESSAGE_PREFIX: ${{ inputs.commit_message_prefix }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DRY_RUN="${INPUT_DRY_RUN}"
            EXTRACT_DESTINATION_VALUE="${INPUT_EXTRACT_DESTINATION}"
            EXECUTE_BASH_FROM_MARKDOWN_VALUE="${INPUT_EXECUTE_BASH_FROM_MARKDOWN}"
            COMMIT_EXTRACTED_FILES_VALUE="${INPUT_COMMIT_EXTRACTED_FILES}"
            COMMIT_MESSAGE_PREFIX_VALUE="${INPUT_COMMIT_MESSAGE_PREFIX}"
          else
            DRY_RUN="false"
            EXTRACT_DESTINATION_VALUE="."
            EXECUTE_BASH_FROM_MARKDOWN_VALUE="true"
            COMMIT_EXTRACTED_FILES_VALUE="true"
            COMMIT_MESSAGE_PREFIX_VALUE="chore(actions): apply extracted source zip"
          fi

          {
            echo "dry_run=${DRY_RUN}"
            echo "extract_destination=${EXTRACT_DESTINATION_VALUE}"
            echo "execute_bash_from_markdown=${EXECUTE_BASH_FROM_MARKDOWN_VALUE}"
            echo "commit_extracted_files=${COMMIT_EXTRACTED_FILES_VALUE}"
            echo "commit_message_prefix=${COMMIT_MESSAGE_PREFIX_VALUE}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "DRY_RUN=${DRY_RUN}"
            echo "EXTRACT_DESTINATION=${EXTRACT_DESTINATION_VALUE}"
            echo "EXECUTE_BASH_FROM_MARKDOWN=${EXECUTE_BASH_FROM_MARKDOWN_VALUE}"
            echo "COMMIT_EXTRACTED_FILES=${COMMIT_EXTRACTED_FILES_VALUE}"
            echo "COMMIT_MESSAGE_PREFIX=${COMMIT_MESSAGE_PREFIX_VALUE}"
          } >> "${GITHUB_ENV}"

      - name: Set extracted script path
        shell: bash
        run: |
          echo "EXTRACTED_SCRIPT=${{ runner.temp }}/extracted-bash-blocks.sh" >> "${GITHUB_ENV}"

      # Detecta arquivos .zip e .md criados ou alterados no último commit em docs/actions-exec/.
      - name: Detect ZIP and Markdown files changed in docs/actions-exec
        id: detect_files
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_ACTION_FILES="$(
            git diff --name-status HEAD^ HEAD -- docs/actions-exec/ \
              | awk '$1 == "A" || $1 == "M" { print $2 }' \
              | tr '\\' '/' \
              || true
          )"

          echo "Arquivos criados ou alterados no último commit em docs/actions-exec/:"
          echo "--------------------------------------------------"
          if [[ -n "${CHANGED_ACTION_FILES}" ]]; then
            printf '%s\n' "${CHANGED_ACTION_FILES}"
          else
            echo "Nenhum arquivo criado ou alterado."
          fi
          echo "--------------------------------------------------"

          ZIP_FILES="$(
            printf '%s\n' "${CHANGED_ACTION_FILES}" \
              | grep -Ei '^docs/actions-exec/.+\.zip$' \
              || true
          )"

          MARKDOWN_FILES="$(
            printf '%s\n' "${CHANGED_ACTION_FILES}" \
              | grep -Ei '^docs/actions-exec/.+\.md$' \
              || true
          )"

          if [[ -z "${ZIP_FILES}" && -z "${MARKDOWN_FILES}" ]]; then
            echo "Nenhum arquivo .zip ou .md criado/alterado em docs/actions-exec/. Encerrando sem processamento."
            echo "should_process=false" >> "${GITHUB_OUTPUT}"
            echo "has_zip_files=false" >> "${GITHUB_OUTPUT}"
            echo "has_markdown_files=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          validate_relative_path() {
            local path_value="$1"
            local label="$2"

            case "${path_value}" in
              /*|../*|*"/../"*|*".."*)
                echo "Erro: ${label} inválido ou potencialmente inseguro: ${path_value}"
                exit 1
                ;;
            esac
          }

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            validate_relative_path "${zip_file}" "caminho do ZIP"

            if [[ ! -f "${zip_file}" ]]; then
              echo "Erro: ZIP criado/alterado no último commit não foi encontrado no repositório: ${zip_file}"
              exit 1
            fi
          done <<< "${ZIP_FILES}"

          while IFS= read -r markdown_file; do
            [[ -z "${markdown_file}" ]] && continue
            validate_relative_path "${markdown_file}" "caminho do Markdown"

            if [[ ! -f "${markdown_file}" ]]; then
              echo "Erro: Markdown criado/alterado no último commit não foi encontrado no repositório: ${markdown_file}"
              exit 1
            fi
          done <<< "${MARKDOWN_FILES}"

          echo "ZIPs detectados:"
          if [[ -n "${ZIP_FILES}" ]]; then
            printf '%s\n' "${ZIP_FILES}"
          else
            echo "Nenhum."
          fi

          echo "Markdowns detectados:"
          if [[ -n "${MARKDOWN_FILES}" ]]; then
            printf '%s\n' "${MARKDOWN_FILES}"
          else
            echo "Nenhum."
          fi

          {
            echo "should_process=true"
            if [[ -n "${ZIP_FILES}" ]]; then
              echo "has_zip_files=true"
            else
              echo "has_zip_files=false"
            fi
            if [[ -n "${MARKDOWN_FILES}" ]]; then
              echo "has_markdown_files=true"
            else
              echo "has_markdown_files=false"
            fi
            echo "zip_files<<EOF"
            printf '%s\n' "${ZIP_FILES}"
            echo "EOF"
            echo "markdown_files<<EOF"
            printf '%s\n' "${MARKDOWN_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "ZIP_FILES<<EOF"
            printf '%s\n' "${ZIP_FILES}"
            echo "EOF"
            echo "MARKDOWN_FILES<<EOF"
            printf '%s\n' "${MARKDOWN_FILES}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      # Valida o diretório de extração para evitar escrita fora do workspace.
      - name: Validate extraction destination
        if: ${{ steps.detect_files.outputs.should_process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EXTRACT_DESTINATION}" ]]; then
            echo "Erro: extract_destination não pode ser vazio."
            exit 1
          fi

          case "${EXTRACT_DESTINATION}" in
            /*|../*|*"/../"*|*".."*)
              echo "Erro: destino inválido ou potencialmente inseguro: ${EXTRACT_DESTINATION}"
              exit 1
              ;;
          esac

          mkdir -p "${EXTRACT_DESTINATION}"
          echo "Destino de extração validado: ${EXTRACT_DESTINATION}"

      # Testa a integridade do ZIP antes de listar ou extrair.
      - name: Test ZIP integrity
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_zip_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            unzip -t "${zip_file}"
          done <<< "${ZIP_FILES}"

      # Lista o conteúdo do ZIP para auditoria no log.
      - name: List ZIP contents
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_zip_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            echo "Conteúdo do ZIP: ${zip_file}"
            echo "=================================================="
            unzip -l "${zip_file}"
            echo "=================================================="
          done <<< "${ZIP_FILES}"

      # Proteção contra Zip Slip: bloqueia caminhos absolutos ou traversal dentro do ZIP.
      - name: Validate ZIP internal paths
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_zip_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            INVALID_PATHS="$(
              zipinfo -1 "${zip_file}"               | awk '
                    $0 ~ /^\// { print; next }
                    $0 ~ /(^|\/)\.\.($|\/)/ { print; next }
                  ' || true
            )"

            if [[ -n "${INVALID_PATHS}" ]]; then
              echo "Erro: o ZIP contém caminhos internos inseguros: ${zip_file}"
              printf '%s\n' "${INVALID_PATHS}"
              exit 1
            fi
          done <<< "${ZIP_FILES}"

          echo "Caminhos internos dos ZIPs validados com sucesso."

      # O pacote deve trazer codigo-fonte/ como raiz lógica para aplicar no repositório.
      - name: Validate source root inside ZIP
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_zip_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            if ! zipinfo -1 "${zip_file}" | grep -Eq '^codigo-fonte/[^/].*'; then
              echo "Erro: o ZIP precisa conter arquivos dentro de codigo-fonte/: ${zip_file}"
              exit 1
            fi
          done <<< "${ZIP_FILES}"

          echo "Raiz codigo-fonte/ encontrada nos ZIPs."

      # Extrai blocos delimitados por ```bash e ``` dos Markdowns detectados.
      - name: Extract bash blocks from Markdown
        id: extract_bash
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_markdown_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          : > "${EXTRACTED_SCRIPT}"

          while IFS= read -r markdown_file; do
            [[ -z "${markdown_file}" ]] && continue
            MARKDOWN_FILE="${markdown_file}" awk '
              BEGIN {
                in_bash_block = 0
                bash_block_count = 0
              }

              /^```bash[[:space:]]*$/ {
                in_bash_block = 1
                bash_block_count++
                print ""
                print "# ---- bash block " bash_block_count " from " ENVIRON["MARKDOWN_FILE"] " ----"
                next
              }

              /^```[[:space:]]*$/ {
                if (in_bash_block == 1) {
                  in_bash_block = 0
                  print ""
                }
                next
              }

              {
                if (in_bash_block == 1) {
                  print
                }
              }

              END {
                if (in_bash_block == 1) {
                  print "Erro: existe um bloco ```bash sem fechamento com ``` em " ENVIRON["MARKDOWN_FILE"] "." > "/dev/stderr"
                  exit 2
                }

                if (bash_block_count == 0) {
                  print "Aviso: nenhum bloco ```bash foi encontrado em " ENVIRON["MARKDOWN_FILE"] "." > "/dev/stderr"
                }
              }
            ' "${markdown_file}" >> "${EXTRACTED_SCRIPT}"
          done <<< "${MARKDOWN_FILES}"

          chmod 700 "${EXTRACTED_SCRIPT}"

          if grep -q '[^[:space:]]' "${EXTRACTED_SCRIPT}"; then
            echo "has_bash_blocks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_bash_blocks=false" >> "${GITHUB_OUTPUT}"
            echo "Nenhum comando bash executável foi encontrado no Markdown."
          fi

      # Exibe os comandos extraídos do Markdown, quando houver.
      - name: Show extracted bash commands
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_markdown_files == 'true' && steps.extract_bash.outputs.has_bash_blocks == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos Markdown usados:"
          printf '%s\n' "${MARKDOWN_FILES}"
          echo "Comandos bash extraídos:"
          echo "=================================================="
          cat "${EXTRACTED_SCRIPT}"
          echo "=================================================="

      - name: Report no action files changed on push
        if: ${{ steps.detect_files.outputs.should_process != 'true' }}
        shell: bash
        run: |
          echo "Nenhum .zip ou .md foi criado/alterado em docs/actions-exec/ no último commit."
          echo "O workflow foi disparado por push na main e encerrou sem alterações."

      # Quando dry_run estiver ativo, apenas valida e mostra o que seria feito.
      - name: Stop in dry run mode
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run ativado."
          echo "Destino que seria usado: ${EXTRACT_DESTINATION}"

          if [[ -n "${ZIP_FILES}" ]]; then
            echo "ZIPs detectados:"
            printf '%s\n' "${ZIP_FILES}"
          fi

          if [[ -n "${MARKDOWN_FILES}" ]]; then
            echo "Markdowns detectados:"
            printf '%s\n' "${MARKDOWN_FILES}"
            echo "execute_bash_from_markdown=${EXECUTE_BASH_FROM_MARKDOWN}"
          fi

          echo "Nenhum arquivo foi extraído e nenhum comando bash foi executado."

      # Extrai o ZIP apenas quando dry_run = false.
      - name: Extract ZIP contents
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.has_zip_files == 'true' && steps.resolve_options.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          TEMP_EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEMP_EXTRACT_DIR}"' EXIT

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            ZIP_EXTRACT_DIR="${TEMP_EXTRACT_DIR}/$(basename "${zip_file}" .zip)"
            mkdir -p "${ZIP_EXTRACT_DIR}"
            unzip -q "${zip_file}" -d "${ZIP_EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DESTINATION}"

            shopt -s dotglob nullglob
            cp -R "${ZIP_EXTRACT_DIR}/codigo-fonte/"* "${EXTRACT_DESTINATION}/"

            echo "ZIP extraído com sucesso."
            echo "ZIP: ${zip_file}"
            echo "Origem aplicada: codigo-fonte/"
            echo "Destino: ${EXTRACT_DESTINATION}"
          done <<< "${ZIP_FILES}"

      # Executa os blocos bash do Markdown apenas quando essa opção estiver habilitada.
      - name: Execute extracted bash commands from Markdown
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.execute_bash_from_markdown == 'true' && steps.detect_files.outputs.has_markdown_files == 'true' && steps.extract_bash.outputs.has_bash_blocks == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail "${EXTRACTED_SCRIPT}"

      # Mostra alterações após extração e/ou execução opcional.
      - name: Show repository changes
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git status --short

      # Commit automático opcional.
      - name: Commit and push changes
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.commit_extracted_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --short)" ]]; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${EXTRACT_DESTINATION}"

          while IFS= read -r markdown_file; do
            [[ -z "${markdown_file}" ]] && continue
            git add "${markdown_file}" || true
          done <<< "${MARKDOWN_FILES}"

          while IFS= read -r zip_file; do
            [[ -z "${zip_file}" ]] && continue
            git add "${zip_file}" || true
          done <<< "${ZIP_FILES}"

          COMMIT_MESSAGE_FILE="$(mktemp)"
          {
            echo "${COMMIT_MESSAGE_PREFIX}"
            echo ""
            if [[ -n "${MARKDOWN_FILES}" ]]; then
              printf '%s\n' "${MARKDOWN_FILES}"
            fi
            if [[ -n "${ZIP_FILES}" ]]; then
              printf '%s\n' "${ZIP_FILES}"
            fi
          } > "${COMMIT_MESSAGE_FILE}"

          git commit -F "${COMMIT_MESSAGE_FILE}"
          git push

      # Mensagem final quando o commit automático não foi ativado.
      - name: Report manual commit required
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.commit_extracted_files != 'true' }}
        shell: bash
        run: |
          echo "Processamento concluído sem commit automático."
          echo "Revise as alterações no log do job antes de versionar manualmente."
