name: Extract Source ZIP And Optional Bash From Last Commit

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Quando true, apenas detecta, valida e exibe o que seria feito sem alterar o repositório"
        required: true
        default: false
        type: boolean
      extract_destination:
        description: "Diretório de destino para extrair o ZIP, relativo à raiz do repositório"
        required: true
        default: "."
        type: string
      execute_bash_from_markdown:
        description: "Quando true, executa blocos bash do .md citado no último commit"
        required: true
        default: true
        type: boolean
      commit_extracted_files:
        description: "Quando true, cria commit e push dos arquivos extraídos/alterados"
        required: true
        default: true
        type: boolean
      commit_message_prefix:
        description: "Prefixo da mensagem do commit automático"
        required: true
        default: "chore(actions): apply extracted source zip"
        type: string

permissions:
  contents: write

jobs:
  extract-source-zip-and-optional-bash:
    name: Detect ZIP, extract source files and optionally run Markdown bash
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do repositório para ler o último commit e acessar arquivos versionados.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Resolve os valores do workflow para suportar execução manual e automática via push.
      - name: Resolve workflow options
        id: resolve_options
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_EXTRACT_DESTINATION: ${{ inputs.extract_destination }}
          INPUT_EXECUTE_BASH_FROM_MARKDOWN: ${{ inputs.execute_bash_from_markdown }}
          INPUT_COMMIT_EXTRACTED_FILES: ${{ inputs.commit_extracted_files }}
          INPUT_COMMIT_MESSAGE_PREFIX: ${{ inputs.commit_message_prefix }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DRY_RUN="${INPUT_DRY_RUN}"
            EXTRACT_DESTINATION_VALUE="${INPUT_EXTRACT_DESTINATION}"
            EXECUTE_BASH_FROM_MARKDOWN_VALUE="${INPUT_EXECUTE_BASH_FROM_MARKDOWN}"
            COMMIT_EXTRACTED_FILES_VALUE="${INPUT_COMMIT_EXTRACTED_FILES}"
            COMMIT_MESSAGE_PREFIX_VALUE="${INPUT_COMMIT_MESSAGE_PREFIX}"
          else
            DRY_RUN="false"
            EXTRACT_DESTINATION_VALUE="."
            EXECUTE_BASH_FROM_MARKDOWN_VALUE="true"
            COMMIT_EXTRACTED_FILES_VALUE="true"
            COMMIT_MESSAGE_PREFIX_VALUE="chore(actions): apply extracted source zip"
          fi

          {
            echo "dry_run=${DRY_RUN}"
            echo "extract_destination=${EXTRACT_DESTINATION_VALUE}"
            echo "execute_bash_from_markdown=${EXECUTE_BASH_FROM_MARKDOWN_VALUE}"
            echo "commit_extracted_files=${COMMIT_EXTRACTED_FILES_VALUE}"
            echo "commit_message_prefix=${COMMIT_MESSAGE_PREFIX_VALUE}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "DRY_RUN=${DRY_RUN}"
            echo "EXTRACT_DESTINATION=${EXTRACT_DESTINATION_VALUE}"
            echo "EXECUTE_BASH_FROM_MARKDOWN=${EXECUTE_BASH_FROM_MARKDOWN_VALUE}"
            echo "COMMIT_EXTRACTED_FILES=${COMMIT_EXTRACTED_FILES_VALUE}"
            echo "COMMIT_MESSAGE_PREFIX=${COMMIT_MESSAGE_PREFIX_VALUE}"
          } >> "${GITHUB_ENV}"

      - name: Set extracted script path
        shell: bash
        run: |
          echo "EXTRACTED_SCRIPT=${{ runner.temp }}/extracted-bash-blocks.sh" >> "${GITHUB_ENV}"

      # Lê a mensagem do último commit, detecta o primeiro .zip obrigatório
      # e, opcionalmente, o primeiro .md para manter compatibilidade com o workflow anterior.
      - name: Detect ZIP and Markdown files from last commit message
        id: detect_files
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

          echo "Mensagem do último commit:"
          echo "--------------------------------------------------"
          printf '%s\n' "${COMMIT_MESSAGE}"
          echo "--------------------------------------------------"

          NORMALIZED_COMMIT_MESSAGE="$(
            printf '%s\n' "${COMMIT_MESSAGE}" | tr '\\' '/'
          )"

          ZIP_FILE="$(
            printf '%s\n' "${NORMALIZED_COMMIT_MESSAGE}"               | grep -Eio '([A-Za-z0-9._/-]+\.zip)'               | head -n 1 || true
          )"

          MARKDOWN_FILE="$(
            printf '%s\n' "${NORMALIZED_COMMIT_MESSAGE}"               | grep -Eio '([A-Za-z0-9._/-]+\.md)'               | head -n 1 || true
          )"

          if [[ -z "${ZIP_FILE}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              echo "Nenhum arquivo .zip foi encontrado na mensagem do último commit. Encerrando sem processamento."
              echo "should_process=false" >> "${GITHUB_OUTPUT}"
              echo "markdown_file=" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Erro: nenhum arquivo .zip foi encontrado na mensagem do último commit."
            echo "Exemplo de mensagem válida:"
            echo "feat: aplicar fg-008-integracoes-api-webhooks_codigo-fonte_atualizado.zip"
            exit 1
          fi

          validate_relative_path() {
            local path_value="$1"
            local label="$2"

            case "${path_value}" in
              /*|../*|*"/../"*|*".."*)
                echo "Erro: ${label} inválido ou potencialmente inseguro: ${path_value}"
                exit 1
                ;;
            esac
          }

          validate_relative_path "${ZIP_FILE}" "caminho do ZIP"

          if [[ ! -f "${ZIP_FILE}" ]]; then
            echo "Erro: ZIP citado no último commit não foi encontrado no repositório: ${ZIP_FILE}"
            echo "O caminho deve ser relativo à raiz do repositório."
            exit 1
          fi

          if [[ -n "${MARKDOWN_FILE}" ]]; then
            validate_relative_path "${MARKDOWN_FILE}" "caminho do Markdown"

            if [[ ! -f "${MARKDOWN_FILE}" ]]; then
              echo "Aviso: Markdown citado no commit não foi encontrado: ${MARKDOWN_FILE}"
              echo "A etapa de extração de bash será ignorada."
              MARKDOWN_FILE=""
            fi
          fi

          echo "ZIP detectado: ${ZIP_FILE}"

          if [[ -n "${MARKDOWN_FILE}" ]]; then
            echo "Markdown detectado: ${MARKDOWN_FILE}"
          else
            echo "Nenhum Markdown válido detectado. Apenas o ZIP será processado."
          fi

          echo "should_process=true" >> "${GITHUB_OUTPUT}"
          echo "zip_file=${ZIP_FILE}" >> "${GITHUB_OUTPUT}"
          echo "markdown_file=${MARKDOWN_FILE}" >> "${GITHUB_OUTPUT}"
          echo "ZIP_FILE=${ZIP_FILE}" >> "${GITHUB_ENV}"
          echo "MARKDOWN_FILE=${MARKDOWN_FILE}" >> "${GITHUB_ENV}"

      # Valida o diretório de extração para evitar escrita fora do workspace.
      - name: Validate extraction destination
        if: ${{ steps.detect_files.outputs.should_process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EXTRACT_DESTINATION}" ]]; then
            echo "Erro: extract_destination não pode ser vazio."
            exit 1
          fi

          case "${EXTRACT_DESTINATION}" in
            /*|../*|*"/../"*|*".."*)
              echo "Erro: destino inválido ou potencialmente inseguro: ${EXTRACT_DESTINATION}"
              exit 1
              ;;
          esac

          mkdir -p "${EXTRACT_DESTINATION}"
          echo "Destino de extração validado: ${EXTRACT_DESTINATION}"

      # Testa a integridade do ZIP antes de listar ou extrair.
      - name: Test ZIP integrity
        if: ${{ steps.detect_files.outputs.should_process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "${ZIP_FILE}"

      # Lista o conteúdo do ZIP para auditoria no log.
      - name: List ZIP contents
        if: ${{ steps.detect_files.outputs.should_process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Conteúdo do ZIP: ${ZIP_FILE}"
          echo "=================================================="
          unzip -l "${ZIP_FILE}"
          echo "=================================================="

      # Proteção contra Zip Slip: bloqueia caminhos absolutos ou traversal dentro do ZIP.
      - name: Validate ZIP internal paths
        if: ${{ steps.detect_files.outputs.should_process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          INVALID_PATHS="$(
            zipinfo -1 "${ZIP_FILE}"               | awk '
                  $0 ~ /^\// { print; next }
                  $0 ~ /(^|\/)\.\.($|\/)/ { print; next }
                ' || true
          )"

          if [[ -n "${INVALID_PATHS}" ]]; then
            echo "Erro: o ZIP contém caminhos internos inseguros:"
            printf '%s\n' "${INVALID_PATHS}"
            exit 1
          fi

          echo "Caminhos internos do ZIP validados com sucesso."

      # Mantém a melhoria anterior: se a mensagem do commit citar um .md,
      # extrai somente blocos delimitados por ```bash e ```.
      - name: Extract bash blocks from Markdown
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.markdown_file != '' }}
        shell: bash
        run: |
          set -euo pipefail

          awk '
            BEGIN {
              in_bash_block = 0
              bash_block_count = 0
            }

            /^```bash[[:space:]]*$/ {
              in_bash_block = 1
              bash_block_count++
              print ""
              print "# ---- bash block " bash_block_count " from " ENVIRON["MARKDOWN_FILE"] " ----"
              next
            }

            /^```[[:space:]]*$/ {
              if (in_bash_block == 1) {
                in_bash_block = 0
                print ""
              }
              next
            }

            {
              if (in_bash_block == 1) {
                print
              }
            }

            END {
              if (in_bash_block == 1) {
                print "Erro: existe um bloco ```bash sem fechamento com ```." > "/dev/stderr"
                exit 2
              }

              if (bash_block_count == 0) {
                print "Aviso: nenhum bloco ```bash foi encontrado no Markdown." > "/dev/stderr"
              }
            }
          ' "${MARKDOWN_FILE}" > "${EXTRACTED_SCRIPT}"

          chmod 700 "${EXTRACTED_SCRIPT}"

      # Exibe os comandos extraídos do Markdown, quando houver.
      - name: Show extracted bash commands
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.detect_files.outputs.markdown_file != '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivo Markdown usado: ${MARKDOWN_FILE}"
          echo "Comandos bash extraídos:"
          echo "=================================================="
          cat "${EXTRACTED_SCRIPT}"
          echo "=================================================="

      - name: Report no ZIP reference on push
        if: ${{ steps.detect_files.outputs.should_process != 'true' }}
        shell: bash
        run: |
          echo "Nenhum .zip foi referenciado na mensagem do último commit."
          echo "O workflow foi disparado por push na main e encerrou sem alterações."

      # Quando dry_run estiver ativo, apenas valida e mostra o que seria feito.
      - name: Stop in dry run mode
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "Dry run ativado."
          echo "ZIP detectado e validado: ${ZIP_FILE}"
          echo "Destino que seria usado: ${EXTRACT_DESTINATION}"

          if [[ -n "${MARKDOWN_FILE}" ]]; then
            echo "Markdown detectado: ${MARKDOWN_FILE}"
            echo "execute_bash_from_markdown=${EXECUTE_BASH_FROM_MARKDOWN}"
          fi

          echo "Nenhum arquivo foi extraído e nenhum comando bash foi executado."

      # Extrai o ZIP apenas quando dry_run = false.
      - name: Extract ZIP contents
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -o "${ZIP_FILE}" -d "${EXTRACT_DESTINATION}"

          echo "ZIP extraído com sucesso."
          echo "ZIP: ${ZIP_FILE}"
          echo "Destino: ${EXTRACT_DESTINATION}"

      # Executa os blocos bash do Markdown apenas quando essa opção estiver habilitada.
      - name: Execute extracted bash commands from Markdown
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.execute_bash_from_markdown == 'true' && steps.detect_files.outputs.markdown_file != '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s "${EXTRACTED_SCRIPT}" ]]; then
            echo "Nenhum comando bash extraído para executar."
            exit 0
          fi

          bash -euo pipefail "${EXTRACTED_SCRIPT}"

      # Mostra alterações após extração e/ou execução opcional.
      - name: Show repository changes
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git status --short

      # Commit automático opcional.
      - name: Commit and push changes
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.commit_extracted_files == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --short)" ]]; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${EXTRACT_DESTINATION}"

          if [[ -n "${MARKDOWN_FILE}" ]]; then
            git add "${MARKDOWN_FILE}" || true
          fi

          git commit -m "${COMMIT_MESSAGE_PREFIX}: ${ZIP_FILE}"
          git push

      # Mensagem final quando o commit automático não foi ativado.
      - name: Report manual commit required
        if: ${{ steps.detect_files.outputs.should_process == 'true' && steps.resolve_options.outputs.dry_run != 'true' && steps.resolve_options.outputs.commit_extracted_files != 'true' }}
        shell: bash
        run: |
          echo "Processamento concluído sem commit automático."
          echo "Revise as alterações no log do job antes de versionar manualmente."
